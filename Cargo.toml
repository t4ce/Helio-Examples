[dependencies]
helio = { workspace = true, features = ["bake"] }
helio-controls = { workspace = true, features = ["winit"] }
helio-artifact = { path = "../Helio/crates/helio-artifact" }
helio-core = { workspace = true }
libhelio = { workspace = true }
helio-pass-sprite-batch = { workspace = true }
helio-pass-sprite-cull = { workspace = true }
helio-pass-sprite-simulate = { workspace = true }
helio-pass-radiance-cascades-2d = { workspace = true }
helio-xr = { workspace = true }
helio-asset-compat = { workspace = true }
helio-pass-tsr = { workspace = true }
helio-pass-fxaa = { path = "../Helio/crates/passes/3d/helio-pass-fxaa" }
helio-pass-corona = { workspace = true }
helio-pass-decal = { path = "../Helio/crates/passes/3d/helio-pass-decal" }
helio-pass-debug-overlay = { path = "../Helio/crates/passes/3d/helio-pass-debug-overlay" }
helio-pass-perf-overlay = { path = "../Helio/crates/passes/3d/helio-pass-perf-overlay" }
helio-pass-postprocess = { path = "../Helio/crates/passes/3d/helio-pass-postprocess" }
helio-pass-voxel-raymarch = { path = "../Helio/crates/passes/3d/helio-pass-voxel-raymarch" }
helio-pass-voxel-mesh = { path = "../Helio/crates/passes/3d/helio-pass-voxel-mesh" }
helio-pass-planetary-voxel = { workspace = true }
helio-pass-gbuffer = { path = "../Helio/crates/passes/3d/helio-pass-gbuffer" }
helio-pass-virtual-geometry = { path = "../Helio/crates/passes/3d/helio-pass-virtual-geometry" }
helio-voxel-core = { path = "../Helio/crates/helio-voxel-core" }
helio-planet-voxel-core = { workspace = true }
helio-default-graphs = { path = "../Helio/crates/helio-default-graphs" }
helio-pass-water-sim = { path = "../Helio/crates/passes/3d/helio-pass-water-sim" }
rapier3d = "0.24"
image = { workspace = true, features = ["png"] }
bytemuck = { workspace = true }
glam = { workspace = true }
winit = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
microfont = "3.7.8"
salva3d = { version = "0.9", features = ["dim3", "parry", "rapier"] }

