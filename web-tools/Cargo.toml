[package]
name = "helio-web-tools"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "helio_examples"

[[bin]]
name = "helio_examples"
path = "src/hub.rs"

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
